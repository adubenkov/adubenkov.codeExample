# gate — commit status по ВЕРДИКТУ РЕВЬЮ, а не по тестам.
#
# Эталон канона: dev-process/templates/gate.yml. Копия в проекте —
# .github/workflows/gate.yml (GitHub требует ровно этот путь, docs/boundary.md);
# расхождение по существу ловит `dev-process/bin/process-doctor`.
#
# ЧТО ДЕЛАЕТ. Читает комментарии PR, ищет ПОСЛЕДНИЙ вердикт `code-reviewer`,
# привязанный к ВЕРШИНЕ ветки, и выставляет статус `gate`: APPROVE → success,
# BLOCK → failure, вердикта на этот SHA нет → failure «ревью не проводилось».
# Тестов здесь нет и не должно быть: тесты — отдельная джоба `ci`, и бегут они
# по ПУТЯМ ДИФФА, а не по факту PR (docs/TEAM.md, «Два имени»).
#
# ВЕРДИКТ АВТОРА НЕ СЧИТАЕТСЯ. Зелёный `gate` обязан означать «смотрел НЕ тот,
# кто писал», иначе он не значит ничего. Найдено инцидентом в проекте (решение
# PO 2026-09-09): роль поставила штамп на собственном PR, и статус позеленел.
# Ставить вердикт вправе только ревьюер или оркестратор (осознанное закрытие
# гейта с указанием правила).
#
# КАК ПРОВЕРЯЕТСЯ «НЕ АВТОР» — два способа, выбирает AUTHOR_CHECK ниже.
#   login — комментарии учётной записи автора PR отбрасываются до разбора.
#           Работает там, где у ролей РАЗНЫЕ учётные записи GitHub.
#   role  — умолчание; считается роль, объявленная третьей строкой вердикта
#           (`role: code-reviewer` либо `role: оркестратор`). Нужен там, где
#           все агенты ходят ОДНИМ аккаунтом владельца: сравнение логинов там
#           отбрасывает настоящий вердикт вместе с чужими, и гейт не зеленеет
#           никогда (найдено проектом 2026-09-14, решение PO того же дня).
# Строка `role:` обязательна в обоих способах. Ловит она случайный самоштамп
# (роль подписалась своим именем — тот самый инцидент 2026-09-09) и НЕ ловит
# осознанную ложь роли: машинной защиты от неё в проекте на один аккаунт не
# существует, и делать вид, что она есть, хуже, чем назвать это вслух. Что
# защищает на самом деле — свежий инстанс ревьюера с чужим методом чтения.
# Единственный путь к машинной проверке — отдельный аккаунт или токен для
# роли ревьюера; тогда способ `login` снова осмыслен. Решение за PO.
#
# КОНТРАКТ ВЕРДИКТА (docs/TEAM.md, «Контракт вердиктов машиночитаем») — первые
# ТРИ строки комментария, целиком, без обрамления:
#   GATE: APPROVE|BLOCK
#   sha: <headRefOid>
#   role: code-reviewer | оркестратор
# Матч привязан к первой строке намеренно. Свободный `test("GATE: APPROVE")` по
# всему телу зеленит статус на любом УПОМИНАНИИ якоря — например, в комментарии,
# который цитирует этот контракт, или в BLOCK'е, объясняющем, чего не хватило
# для APPROVE. Это дыра «тихий отказ»: merge без ревью при зелёном статусе.
#
# ДИФФ БЕЗ ИЗМЕНЕНИЯ ПОВЕДЕНИЯ — ЗЕЛЁНЫЙ БЕЗ ВЕРДИКТА (решение PO 2026-09-19).
# Правка одних докстрок и комментариев в `.py` доказуема: дерево разбора до и
# после совпадает. Раньше такой PR в рисковом файле тянул гейт, qa, приёмку и
# фриз ствола (девять строк в кавычках — четыре стадии). Проверка стоит ЗДЕСЬ,
# в джобе, а не в обещании автора: шаг зовёт `pr-category.py` (вендоренная
# копия `.github/scripts/pr-category.py` либо канон рядом на self-hosted
# раннере) и при доказательстве ставит статус success сам. Инструмента нет
# (GitHub-hosted раннер без канона) — шаг молча уступает обычному вердикту.
#
# НЕПРОДУКТОВЫЙ PR — БЕЗ СТАТУСА, НА ЛЮБОМ ТРИГГЕРЕ. Непродуктовый PR вердикта
# не получает по регламенту («Риск-ориентированный конвейер»), и джоба на нём
# не должна выставлять статус вовсе — иначе он вечно красный «нет вердикта».
# `paths-ignore` держит это только для `pull_request`: у `issue_comment` и
# `workflow_dispatch` фильтра путей нет по устройству GitHub, и первый же
# комментарий к доковому PR красил его навсегда, а сторож слияния отказывал по
# проверке, которой по замыслу не должно было быть (найдено проектом
# 2026-09-18). Поэтому тот же список путей проверяется ещё раз ШАГОМ, по
# файлам PR из API, — для всех триггеров одинаково. Два списка ниже обязаны
# совпадать; список — каноническая граница непродуктового (та же, что у
# разрешённых прямых пушей в main). Проект может сузить её своими путями,
# расширять — только вверх по риску.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.cursor/**'
      - '.github/**'
  # Новый комментарий пересчитывает статус без нового коммита. Триггер живёт
  # только в ветке по умолчанию — отсюда самозагрузка через `gh run rerun`
  # (docs/stack/github.md, «PR, вносящий сам gate.yml»).
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Номер PR, для которого пересчитать статус gate'
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

# cancel-in-progress НЕ ставим: каждый вердикт обязан досчитаться до статуса,
# иначе отменённый прогон оставит PR без следа ревью.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

env:
  # role | login — см. шапку. Умолчание — `role`: в парке владельца все агенты
  # ходят одним аккаунтом, и `login` там не зеленеет никогда. `login` — для
  # проекта, где у ролей разные учётные записи.
  AUTHOR_CHECK: role

jobs:
  gate:
    name: gate
    # issue_comment прилетает и на обычные issues — берём только PR.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Полная история нужна шагу «природа диффа»: сверка дерева разбора идёт
      # против merge-base базы и вершины PR, а не против среза.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить вердикт ревью и выставить статус
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha + " " + .base.sha + " " + .user.login')"
          read -r HEAD_SHA BASE_SHA PR_AUTHOR <<< "$PR_JSON"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "PR #$PR, вершина: $HEAD_SHA, база: $BASE_SHA, автор: $PR_AUTHOR, проверка автора: $AUTHOR_CHECK"

          # Непродуктовый PR — статус не выставляется (см. шапку: paths-ignore
          # не знает про issue_comment). Шаблоны — те же, что в paths-ignore;
          # `*` в case пересекает `/`, поэтому `docs/*` здесь равно `docs/**`.
          PRODUCT_FILES=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              docs/* | *.md | .claude/* | .cursor/* | .github/*) ;;
              *) PRODUCT_FILES=$((PRODUCT_FILES + 1)) ;;
            esac
          done <<< "$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')"
          if [ "$PRODUCT_FILES" -eq 0 ]; then
            echo "непродуктовый PR (все пути в границе paths-ignore) — вердикт не положен, статус gate не выставляется"
            exit 0
          fi

          # Природа диффа: только докстроки и комментарии → success без вердикта.
          # Любая ошибка шага (нет инструмента, не разобрался, не тот вывод) —
          # обычный путь через вердикт: недоказанное не доказано.
          TOOL=""
          for candidate in ".github/scripts/pr-category.py" \
                           "${DEV_PROCESS_HOME:-$HOME/Coding/Pet/dev-process}/tools/pr-category.py"; do
            if [ -f "$candidate" ]; then TOOL="$candidate"; break; fi
          done
          if [ -n "$TOOL" ]; then
            git fetch -q origin "$BASE_SHA" "$HEAD_SHA" || true
            NATURE="$(python3 "$TOOL" --project . --base "$BASE_SHA" --head "$HEAD_SHA" 2>&1 || true)"
            echo "$NATURE"
            if printf '%s' "$NATURE" | grep -q "поведение не меняется"; then
              gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
                -f state=success -f context=gate \
                -f description="Дифф без изменения поведения: дерево разбора совпало с базой, вердикт не положен" \
                -f target_url="$RUN_URL" >/dev/null
              echo "Статус: success — дифф без изменения поведения, доказано инструментом"
              exit 0
            fi
          else
            echo "инструмента категории нет (ни .github/scripts/pr-category.py, ни канона рядом) — природа диффа не проверяется"
          fi

          # Последний по времени вердикт на ЭТУ вершину: свежий BLOCK перебивает
          # ранний APPROVE, поэтому tail -n 1, а не «есть хоть один APPROVE».
          # Значения подставляются в программу jq из шелла: у `gh api --jq` нет
          # флага `--arg` (это флаг самого jq; первая редакция падала на нём до
          # того, как прочитан хоть один вердикт — нашёл проект 2026-09-14).
          # shellcheck disable=SC2016  # $comment/$lines/$role — переменные jq, не шелла
          LAST="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[]
                  | . as $comment
                  | select("'"$AUTHOR_CHECK"'" == "role" or $comment.user.login != "'"$PR_AUTHOR"'")
                  | ($comment.body | gsub("\r"; "") | split("\n")) as $lines
                  | select(($lines | length) >= 3)
                  | select($lines[0] | test("^GATE: (APPROVE|BLOCK)[ \t]*$"))
                  | select(($lines[1] | ascii_downcase | gsub("[ \t]"; "")) == "sha:'"$HEAD_SHA"'")
                  | select($lines[2] | ascii_downcase | gsub("[ \t]"; "")
                           | test("^role:(code-reviewer|оркестратор)$"))
                  | (($lines[0] | sub("^GATE: "; "") | sub("[ \t]+$"; ""))
                     + " " + $comment.html_url)' | tail -n 1)"

          VERDICT="${LAST%% *}"
          COMMENT_URL="${LAST#* }"

          case "$VERDICT" in
            APPROVE)
              STATE=success
              DESC="Ревью-гейт пройден"
              TARGET="$COMMENT_URL"
              ;;
            BLOCK)
              STATE=failure
              DESC="Гейт заблокировал: см. комментарий ревьювера"
              TARGET="$COMMENT_URL"
              ;;
            *)
              STATE=failure
              DESC="Нет чужого вердикта GATE (role: code-reviewer|оркестратор) для этого SHA — ревью не проводилось"
              TARGET="$RUN_URL"
              ;;
          esac

          echo "Статус: $STATE — $DESC ($TARGET)"
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f context=gate -f description="$DESC" \
            -f target_url="$TARGET" >/dev/null
